[package]
name = "async-rusqlite"
version = "0.6.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "A tiny executor agnostic wrapper around rusqlite to make calls to it async"
repository = "https://github.com/jsdw/async-rusqlite"

[dependencies]
asyncified = "0.7.0"
rusqlite = "0.41.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
